# Automatically loaded by local `docker compose` commands.
# Coolify passes -f compose.yaml, so it does not load this local-only override.
services:
  app:
    image: tgdrive:local
    env_file:
      - .env
    environment:
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TGDRIVE_PROXY_HOSTS: ""
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8000}:8000"
