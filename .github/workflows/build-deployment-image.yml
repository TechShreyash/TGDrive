name: Build deployment image

on:
    workflow_dispatch:
        inputs:
            redeploy:
                description: Redeploy the dev application in Coolify after publishing
                type: boolean
                default: false

permissions:
    contents: read

concurrency:
    group: build-deployment-image-${{ github.ref }}
    cancel-in-progress: true

jobs:
    prepare:
        name: Select the dev image package
        if: github.ref == 'refs/heads/dev'
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        outputs:
            image: ${{ steps.image.outputs.name }}
        steps:
            - id: image
              run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-deployment" >> "$GITHUB_OUTPUT"

    publish:
        needs: prepare
        uses: ./.github/workflows/container-image.yml
        permissions:
            contents: read
            packages: write
        with:
            image: ${{ needs.prepare.outputs.image }}
            revision: ${{ github.sha }}
            tag: ${{ github.sha }}
            aliases: dev

    redeploy:
        name: Queue the Coolify dev deployment
        needs: publish
        if: inputs.redeploy
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        environment: tgdrive-dev
        permissions: {}
        steps:
            - name: Request a redeploy
              env:
                  WEBHOOK: ${{ secrets.COOLIFY_DEV_DEPLOY_WEBHOOK }}
                  TOKEN: ${{ secrets.COOLIFY_DEV_API_TOKEN }}
              run: |
                  if [ -z "$TOKEN" ] || [[ "$WEBHOOK" != https://* ]]; then
                    echo 'Configure the Coolify deploy URL and token in the tgdrive-dev environment.' >&2
                    exit 1
                  fi
                  status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
                    --proto '=https' --connect-timeout 5 --max-time 20 --request POST \
                    --header "Authorization: Bearer $TOKEN" -- "$WEBHOOK")
                  if [[ "$status" != 2[0-9][0-9] ]]; then
                    echo "Coolify returned HTTP $status." >&2
                    exit 1
                  fi
                  echo 'Coolify accepted the dev redeploy request. Check the application deployment log for health.' >> "$GITHUB_STEP_SUMMARY"
