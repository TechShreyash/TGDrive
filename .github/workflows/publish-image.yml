name: Publish image

# Publishes ghcr.io/<owner>/tgdrive for a version tag once CI has passed on it.
on:
    workflow_run:
        workflows: [CI]
        types: [completed]

permissions:
    contents: read

jobs:
    build:
        name: Build ${{ matrix.platform }}
        if: >-
            github.event.workflow_run.conclusion == 'success' &&
            startsWith(github.event.workflow_run.head_branch, 'v')
        strategy:
            matrix:
                include:
                    - platform: linux/amd64
                      runner: ubuntu-24.04
                    - platform: linux/arm64
                      runner: ubuntu-24.04-arm
        # Native runners: emulated builds of cryptg/libarchive are slow and fragile.
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 40
        permissions:
            contents: read
            packages: write
        steps:
            - name: Check out the tagged commit
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.event.workflow_run.head_sha }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

            - name: Log in to GHCR
              run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            - name: Build and push by digest
              id: build
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: .
                  platforms: ${{ matrix.platform }}
                  provenance: mode=max
                  sbom: true
                  outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/tgdrive,push-by-digest=true,name-canonical=true,push=true
                  cache-from: type=gha,scope=${{ matrix.platform }}
                  cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

            - name: Record digest
              run: |
                  mkdir -p /tmp/digests
                  digest="${{ steps.build.outputs.digest }}"
                  touch "/tmp/digests/${digest#sha256:}"

            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: digest-${{ matrix.runner }}
                  path: /tmp/digests/*
                  retention-days: 1

    manifest:
        name: Tag multi-arch image
        needs: build
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  path: /tmp/digests
                  pattern: digest-*
                  merge-multiple: true

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

            - name: Log in to GHCR
              run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            - name: Create version, minor and latest tags
              env:
                  TAG: ${{ github.event.workflow_run.head_branch }}
              run: |
                  version="${TAG#v}"
                  image="ghcr.io/${{ github.repository_owner }}/tgdrive"
                  image="${image,,}"
                  cd /tmp/digests
                  docker buildx imagetools create \
                    -t "$image:$version" -t "$image:${version%.*}" -t "$image:latest" \
                    $(printf "$image@sha256:%s " *)
                  docker buildx imagetools inspect "$image:$version"
