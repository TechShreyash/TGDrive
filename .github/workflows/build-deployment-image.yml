name: Build deployment image

# Opt-in only: publishing an image never updates a running deployment.
on:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: build-deployment-image-${{ github.ref }}
    cancel-in-progress: false

jobs:
    build:
        name: Build AMD64 deployment image
        runs-on: ubuntu-24.04
        timeout-minutes: 40
        permissions:
            contents: read
            packages: write
        steps:
            - name: Check out selected revision
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Choose a separate deployment package
              id: image
              run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-deployment" >> "$GITHUB_OUTPUT"

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

            - name: Log in to GHCR
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

            - name: Build and publish
              id: build
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: .
                  platforms: linux/amd64
                  push: true
                  tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
                  labels: |
                      org.opencontainers.image.source=https://github.com/${{ github.repository }}
                      org.opencontainers.image.revision=${{ github.sha }}
                  provenance: mode=max
                  sbom: true
                  cache-from: type=gha,scope=deployment-amd64
                  cache-to: type=gha,mode=max,scope=deployment-amd64

            - name: Show the image to deploy manually
              env:
                  IMAGE: ${{ steps.image.outputs.name }}
                  DIGEST: ${{ steps.build.outputs.digest }}
              run: |
                  {
                    echo 'Set this runtime variable in Coolify, then deploy manually:'
                    echo '```text'
                    echo "TGDRIVE_IMAGE=$IMAGE@$DIGEST"
                    echo '```'
                    echo 'Compose file: /compose.prebuilt.yaml'
                    echo "Source commit: $GITHUB_SHA"
                  } >> "$GITHUB_STEP_SUMMARY"
