<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1280" viewBox="0 0 720 1280" role="img" aria-labelledby="title desc">
  <title id="title">Mobile screenshot placeholder</title>
  <desc id="desc">A labelled media slot for a future real TGDrive capture. This is a placeholder, not a product screenshot.</desc>
  <rect width="720" height="1280" rx="16" fill="#f5f7f9"/>
  <rect x="24" y="24" width="672" height="1232" rx="12" fill="#fff" stroke="#dce1e6" stroke-width="2"/>
  <g font-family="Inter, Segoe UI, Arial, sans-serif" text-anchor="middle">
    <text x="360" y="90" fill="#687078" font-size="16" letter-spacing="3">TGDRIVE / MEDIA SLOT</text>
  </g>
  <rect x="308" y="475" width="104" height="80" rx="8" fill="none" stroke="#3157ff" stroke-width="4"/>
  <circle cx="336" cy="501" r="7" fill="#3157ff"/>
  <path d="M318 541 L348 515 L366 531 L384 509 L403 541" fill="none" stroke="#3157ff" stroke-width="4" stroke-linejoin="round"/>
  <g font-family="Inter, Segoe UI, Arial, sans-serif" text-anchor="middle">
    <text x="360" y="620" fill="#181b20" font-size="34" font-weight="700">Your drive, on the go</text>
    <text x="360" y="668" fill="#3157ff" font-size="24" font-weight="600">Mobile screenshot placeholder</text>
    <text x="360" y="712" fill="#687078" font-size="18">Replace this slot with your own capture</text>
    <text x="360" y="1200" fill="#687078" font-size="14" letter-spacing="2">BROWSE / PREVIEW / SHARE</text>
  </g>
</svg>
