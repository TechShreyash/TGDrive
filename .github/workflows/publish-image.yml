name: Publish image

# Publishes ghcr.io/<owner>/tgdrive for a version tag once CI has passed on it.
on:
    workflow_run:
        workflows: [CI]
        types: [completed]

permissions:
    contents: read

concurrency:
    group: publish-image-${{ startsWith(github.event.workflow_run.head_branch, 'v') && 'release' || github.run_id }}
    cancel-in-progress: false
    queue: max

jobs:
    verify:
        name: Verify trusted release
        if: >-
            github.event.workflow_run.conclusion == 'success' &&
            startsWith(github.event.workflow_run.head_branch, 'v') &&
            github.event.workflow_run.event == 'push' &&
            github.event.workflow_run.head_repository.id == github.repository_id
        runs-on: ubuntu-latest
        outputs:
            sha: ${{ steps.release.outputs.sha }}
            version: ${{ steps.release.outputs.version }}
            image: ${{ steps.release.outputs.image }}
            promote_latest: ${{ steps.release.outputs.promote_latest }}
            minor: ${{ steps.release.outputs.minor }}
            promote_minor: ${{ steps.release.outputs.promote_minor }}
        steps:
            - name: Check out trusted main policy
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: main
                  fetch-depth: 0
                  persist-credentials: false
            - name: Bind CI to the application tag and trusted history
              id: release
              run: python3 scripts/verify_image_release.py

    publish:
        needs: verify
        uses: ./.github/workflows/container-image.yml
        permissions:
            contents: read
            packages: write
        with:
            image: ${{ needs.verify.outputs.image }}
            revision: ${{ needs.verify.outputs.sha }}
            tag: ${{ needs.verify.outputs.version }}
            aliases: >-
                ${{ format('{0} {1}',
                    needs.verify.outputs.promote_latest == 'true' && 'latest' || '',
                    needs.verify.outputs.promote_minor == 'true' && needs.verify.outputs.minor || '') }}
