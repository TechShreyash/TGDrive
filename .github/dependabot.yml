version: 2

updates:
    - package-ecosystem: uv
      directory: /
      target-branch: dev
      schedule:
          interval: weekly
          day: monday
          time: "04:00"
          timezone: Asia/Kolkata
      open-pull-requests-limit: 2
      groups:
          python-dependencies:
              patterns: ["*"]
              update-types: ["minor", "patch"]
      commit-message:
          prefix: deps

    - package-ecosystem: github-actions
      directory: /
      target-branch: dev
      schedule:
          interval: weekly
          day: monday
          time: "04:15"
          timezone: Asia/Kolkata
      open-pull-requests-limit: 2
      groups:
          github-actions:
              patterns: ["*"]
              update-types: ["minor", "patch"]
      commit-message:
          prefix: ci

    - package-ecosystem: docker
      directory: /
      target-branch: dev
      schedule:
          interval: weekly
          day: monday
          time: "04:30"
          timezone: Asia/Kolkata
      open-pull-requests-limit: 2
      groups:
          docker-images:
              patterns: ["*"]
              update-types: ["minor", "patch"]
      ignore:
          # Python version changes must update the matching project/CI pins.
          - dependency-name: python
            versions: ["> 3.14.8"]
          - dependency-name: node
            versions: [">= 25"]
      commit-message:
          prefix: docker

    - package-ecosystem: npm
      directory: /website
      target-branch: dev
      schedule:
          interval: weekly
          day: monday
          time: "04:45"
          timezone: Asia/Kolkata
      open-pull-requests-limit: 2
      groups:
          frontend-dependencies:
              patterns: ["*"]
              update-types: ["minor", "patch"]
      ignore:
          - dependency-name: "@types/node"
            versions: [">=25"]
      commit-message:
          prefix: frontend-deps
